        .card-icon { background: rgba(0, 204, 136, 0.1); width: 45px; height: 45px; border-radius: 12px; display: flex; align-items: center; justify-content: center; color: #00cc88; font-size: 20px; margin-bottom: 20px; }
        .card h3 { margin: 0 0 10px 0; font-size: 26px; }
        .card p { color: var(--text-dim); font-size: 15px; line-height: 1.6; margin-bottom: 25px; }

        .btn-group { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
        .btn { padding: 12px 5px; border-radius: 14px; border: none; cursor: pointer; font-weight: 600; text-align: center; text-decoration: none; font-size: 13px; transition: 0.2s; display: flex; align-items: center; justify-content: center; gap: 5px; }
