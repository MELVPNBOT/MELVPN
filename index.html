<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>VPN Connect | Вход</title>
    <script src="https://www.google.com/recaptcha/api.js" async defer></script>
    <style>
        body { margin: 0; padding: 0; font-family: 'Segoe UI', sans-serif; background: #0f0f0f; color: #fff; display: flex; justify-content: center; align-items: center; height: 100vh; }
        .login-box { background: #1a1a1a; padding: 40px; border-radius: 12px; border: 1px solid #333; width: 350px; text-align: center; }
        h1 { color: #00d4ff; margin-bottom: 25px; font-size: 24px; }
        input { width: 100%; padding: 12px; margin: 10px 0; border-radius: 6px; border: 1px solid #444; background: #222; color: #fff; box-sizing: border-box; }
        button { width: 100%; padding: 12px; margin-top: 20px; border: none; border-radius: 6px; background: #00d4ff; color: #000; font-weight: bold; cursor: pointer; transition: 0.3s; }
        button:hover { background: #0099bb; }
        .g-recaptcha { margin-top: 15px; display: flex; justify-content: center; }
    </style>
</head>
<body>
    <div class="login-box">
        <h1>VPN ACCESS</h1>
        <form action="/login" method="POST">
            <input type="text" name="username" placeholder="Имя пользователя" required>
            <input type="password" name="password" placeholder="Пароль" required>
            
            <div class="g-recaptcha" data-sitekey="6Lf-0cQsAAAAANJW7cq3Vez0drU63zbRziSxZR1E"></div>
            
            <button type="submit">ПОДКЛЮЧИТЬСЯ</button>
        </form>
    </div>
</body>
</html>
